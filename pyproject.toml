[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rgcea"
version = "1.0.0"
description = "Recursive Generative Cognitive Evolution Architecture — dream-inspired AI cognition layers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "RGCEA Project" }]
keywords = ["AI", "cognition", "dreaming", "architecture", "memory", "ontology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []          # zero mandatory runtime dependencies

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
rgcea-demo = "scripts.rgcea_demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rgcea*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["rgcea"]
omit = ["tests/*", "scripts/*"]
